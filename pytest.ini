[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    router: routing accuracy tests
    faithfulness: grounding and hallucination tests
    latency: performance benchmarks
    slow: takes more than a second or two
filterwarnings =
    # ADK's own experimental-feature notice, raised by the transfer tool we rely on.
    ignore:.*JSON_SCHEMA_FOR_FUNC_DECL.*:UserWarning
    ignore:.*\[EXPERIMENTAL\].*:UserWarning
    # Deprecations inside google-adk 2.9.1 that this project does not control.
    # `global_instruction` still works and is the documented field for a root
    # agent; migrating to GlobalInstructionPlugin is tracked separately.
    ignore:.*global_instruction field is deprecated.*:DeprecationWarning
    ignore:.*BaseAgentConfig is deprecated.*:DeprecationWarning
